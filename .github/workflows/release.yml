name: Release

# 推送形如 v0.1.0 的标签时，自动在 Windows 上构建并把两种形态附加到 Release
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 运行后端测试
        working-directory: src-tauri
        run: cargo test --lib

      - name: 构建并发布
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "日常新闻 ${{ github.ref_name }}"
          releaseBody: |
            把每天要看的网站收进卡片，用多级文件夹组织；今天没点过的亮红点，点过就熄灭。

            ## 下载哪个

            | 文件 | 说明 |
            | --- | --- |
            | `Daily-Information_*_x64-setup.exe` | **安装版**。可选安装路径，不需要管理员权限，出现在开始菜单，可从「程序和功能」正常卸载。数据保存在 `%APPDATA%\com.dianmao.app\` |
            | `Daily-Information-${{ github.ref_name }}-portable.exe` | **便携版**单文件主程序。双击即运行，无需安装；首次运行前请在 exe 旁新建空的 `data` 文件夹，数据保存在此目录，整个文件夹拷走即可迁移 |

            > 两种形态都未做代码签名，首次运行 Windows SmartScreen 会提示「未知发布者」，点「更多信息 → 仍要运行」即可。

            ## 系统要求

            Windows 10 1809 及以上 / Windows 11，需要 WebView2 运行时（Win11 与新版 Win10 已自带）。
          releaseDraft: false
          prerelease: false
          assetNamePattern: Daily-Information_[version]_[arch][setup][ext]

      - name: 准备便携版
        shell: pwsh
        run: |
          $portable = "Daily-Information-${{ github.ref_name }}-portable.exe"
          Copy-Item "src-tauri/target/release/dianmao.exe" $portable
          "PORTABLE_EXE=$portable" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: 附加便携版到 Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: "日常新闻 ${{ github.ref_name }}"
          body: |
            把每天要看的网站收进卡片，用多级文件夹组织；今天没点过的亮红点，点过就熄灭。

            ## 下载哪个

            | 文件 | 说明 |
            | --- | --- |
            | `Daily-Information_*_x64-setup.exe` | **安装版**。可选安装路径，不需要管理员权限，出现在开始菜单，可从「程序和功能」正常卸载。数据保存在 `%APPDATA%\com.dianmao.app\` |
            | `Daily-Information-${{ github.ref_name }}-portable.exe` | **便携版**单文件主程序。双击即运行，无需安装；首次运行前请在 exe 旁新建空的 `data` 文件夹，数据保存在此目录，整个文件夹拷走即可迁移 |

            > 两种形态都未做代码签名，首次运行 Windows SmartScreen 会提示「未知发布者」，点「更多信息 → 仍要运行」即可。

            ## 系统要求

            Windows 10 1809 及以上 / Windows 11，需要 WebView2 运行时（Win11 与新版 Win10 已自带）。
          files: ${{ env.PORTABLE_EXE }}

      - name: 清理旧的乱码资产名
        uses: actions/github-script@v7
        with:
          script: |
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: context.ref.replace('refs/tags/', ''),
            });
            const { data: assets } = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
            });
            for (const asset of assets) {
              if (['-v0.1.0-.exe', '_0.1.0_x64-setup.exe'].includes(asset.name)) {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: asset.id,
                });
              }
            }
