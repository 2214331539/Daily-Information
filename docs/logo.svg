<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="日常新闻">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#161C26"/>
      <stop offset="1" stop-color="#0B0E13"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2B255"/>
      <stop offset="1" stop-color="#D98C22"/>
    </linearGradient>
  </defs>

  <!-- 应用底板 -->
  <rect width="512" height="512" rx="114" fill="url(#tile)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="112.5"
        fill="none" stroke="#2A3341" stroke-width="3"/>

  <!-- 卯时标记：旋转 45° 的琥珀方块，中心留洞，像一枚巡检印章 -->
  <g transform="translate(256 256) rotate(45)">
    <rect x="-126" y="-126" width="252" height="252" rx="54" fill="url(#amber)"/>
    <rect x="-54" y="-54" width="108" height="108" rx="26" fill="#0B0E13"/>
  </g>
</svg>
